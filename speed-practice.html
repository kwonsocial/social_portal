<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사회 개념 스피드 퀴즈 · 단원 연습</title>
<style>
  :root{
    --board:#1f3a30; --board2:#173027; --frame:#6b4a2f; --chalk:#f4f1e8; --chalk2:#c9d3c8;
    --yellow:#f5d76e; --pink:#f2a7a0; --blue:#9fd0f0; --green:#a8e0a0; --muted:#8fa79a;
    --sans:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);color:var(--chalk);background:#2a1d12;overflow:hidden;word-break:keep-all;-webkit-user-select:none;user-select:none}
  .board{position:fixed;inset:0;border:14px solid var(--frame);border-radius:6px;
    background:
      radial-gradient(1200px 700px at 30% 20%, rgba(255,255,255,.05), transparent 60%),
      radial-gradient(900px 600px at 80% 90%, rgba(255,255,255,.035), transparent 60%),
      linear-gradient(var(--board),var(--board2));
    box-shadow:inset 0 0 80px rgba(0,0,0,.45);display:flex;flex-direction:column}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:2.2vh 3vw}
  .screen[hidden]{display:none}
  button{font:inherit;cursor:pointer;border:2px solid rgba(244,241,232,.55);background:rgba(255,255,255,.06);color:var(--chalk);
    border-radius:14px;padding:.6em 1.1em;font-weight:700}
  button:hover{background:rgba(255,255,255,.12)}
  button:active{transform:scale(.97)}
  .muted{color:var(--muted)}

  /* ===== 시작 화면 ===== */
  #home{align-items:center;justify-content:center;gap:3.2vh;text-align:center}
  #home h1{font-size:clamp(34px,5.4vw,84px);letter-spacing:-.01em;font-weight:800;text-shadow:0 0 1px rgba(255,255,255,.6)}
  #home h1 span{color:var(--yellow)}
  #home .sub{font-size:clamp(16px,1.6vw,26px);color:var(--chalk2)}
  .sets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.2vw;width:min(1300px,92vw)}
  .sets button{padding:1.6vh .8vw;font-size:clamp(18px,2vw,32px);border-style:dashed;display:flex;flex-direction:column;align-items:center;gap:.3em}
  .sets button small{font-size:.45em;font-weight:500;color:var(--chalk2)}
  .homebar{display:flex;gap:1vw;flex-wrap:wrap;justify-content:center;font-size:clamp(14px,1.2vw,20px)}
  .opt{display:flex;align-items:center;gap:.5em;border:2px solid rgba(244,241,232,.3);border-radius:12px;padding:.45em .9em}
  .opt select,.opt input{font:inherit;background:var(--board2);color:var(--chalk);border:1px solid rgba(244,241,232,.4);border-radius:8px;padding:.15em .4em}
  .opt input[type=checkbox]{width:1.2em;height:1.2em;accent-color:var(--yellow)}

  /* ===== 진행 화면 ===== */
  .top{display:flex;justify-content:space-between;align-items:center;font-size:clamp(16px,1.7vw,28px);gap:2vw}
  .top b{color:var(--yellow)}
  #who.flash{animation:flash 1s ease}
  @keyframes flash{0%{color:var(--pink);transform:scale(1.35)}100%{transform:scale(1)}}
  #who{display:inline-block}
  #total.warn{color:var(--pink);border-color:var(--pink)}
  .pill{border:2px solid rgba(244,241,232,.45);border-radius:999px;padding:.2em .9em}
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;text-align:center;padding:0 2vw}
  .unit{font-size:clamp(16px,1.6vw,28px);color:var(--blue);letter-spacing:.04em}
  .q{font-size:clamp(30px,4.3vw,76px);line-height:1.38;font-weight:700;max-width:24em;text-wrap:balance}
  .big{font-size:clamp(56px,11vw,200px);font-weight:900;line-height:1}
  .term{font-size:clamp(48px,7.5vw,140px);font-weight:900;color:var(--yellow);line-height:1.1}
  .alias{font-size:clamp(18px,2vw,32px);color:var(--chalk2)}
  .stamp{font-size:clamp(24px,3vw,52px);font-weight:900;letter-spacing:.1em}
  .ok{color:var(--green)} .bad{color:var(--pink)}
  .timer{display:flex;align-items:center;gap:1.4vw;width:100%}
  .bar{flex:1;height:clamp(14px,1.8vh,24px);border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;border:2px solid rgba(244,241,232,.35)}
  .bar i{display:block;height:100%;width:100%;background:var(--chalk);border-radius:999px;transform-origin:left center}
  .sec{font-size:clamp(44px,5.6vw,96px);font-weight:900;min-width:2ch;text-align:right;font-variant-numeric:tabular-nums}
  .warn .bar i{background:var(--pink)} .warn .sec{color:var(--pink)}
  .controls{display:flex;gap:1.2vw;justify-content:center;flex-wrap:wrap;padding-top:1.6vh}
  .controls button{font-size:clamp(18px,1.9vw,32px);min-width:9em;padding:.55em 1em}
  .controls .main{border-color:var(--green);color:var(--green)}
  .controls .pass{border-color:var(--pink);color:var(--pink)}
  .keys{text-align:center;font-size:clamp(12px,1vw,16px);color:var(--muted);padding-top:.8vh}

  /* ===== 일시정지 ===== */
  #pauseLayer{position:absolute;inset:0;background:rgba(10,20,16,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;z-index:5}
  #pauseLayer[hidden]{display:none}
  #pauseLayer h2{font-size:clamp(40px,6vw,100px)}
  #pauseLayer .row{display:flex;gap:1.2vw}
  #pauseLayer button{font-size:clamp(18px,1.8vw,30px)}

  /* ===== 결과 ===== */
  #end{align-items:center;gap:2vh}
  #end h2{font-size:clamp(28px,3.6vw,60px);margin-top:1vh}
  .score{font-size:clamp(60px,9vw,160px);font-weight:900;color:var(--yellow);line-height:1}
  .review{flex:1;overflow:auto;width:min(1200px,92vw);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1vh 2vw;align-content:start;font-size:clamp(15px,1.25vw,22px);line-height:1.45;padding-right:.5vw}
  .review div{border-bottom:1px dashed rgba(244,241,232,.3);padding:.5em 0}
  .review b{color:var(--yellow);margin-right:.4em}
  .endbtns{display:flex;gap:1vw;padding-bottom:1vh}
  .endbtns button{font-size:clamp(16px,1.5vw,26px)}

  /* ===== 교사용 목록 ===== */
  #list{background:#fff;color:#111;overflow:auto;padding:24px 32px}
  #list .bar2{display:flex;gap:10px;align-items:center;margin-bottom:14px}
  #list button{color:#111;border-color:#999;background:#f3f3f3}
  #list h2{font-size:22px}
  .lgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
  .lset h3{font-size:16px;border-bottom:2px solid #333;padding-bottom:4px;margin-bottom:4px}
  .lset ol{padding-left:1.6em;font-size:13px;line-height:1.55}
  .lset li span{color:#666;font-size:11px;margin-left:.3em}
  @media print{
    body{background:#fff;overflow:visible} .board{position:static;border:0;box-shadow:none;background:#fff}
    .screen:not(#list){display:none!important} #list{position:static;padding:0} #list .bar2{display:none}
  }

  /* ===== 휴대폰·작은 화면 ===== */
  button,.opt{touch-action:manipulation}
  @media (pointer:coarse){ .keys{display:none} }
  @media (max-width:700px), (max-height:520px){
    .board{border-width:7px}
    .screen{padding:12px 14px max(12px,env(safe-area-inset-bottom))}
    #home{justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;gap:14px;padding-top:18px}
    #home > *{flex:none}
    #home h1{font-size:30px}
    #home .sub{font-size:14px;line-height:1.5}
    .sets{width:100%;gap:8px}
    .sets button{padding:10px 6px;font-size:18px;border-radius:12px}
    .sets button small{font-size:11px}
    .homebar{gap:8px;font-size:14px;padding-bottom:8px}
    .homebar button{padding:.5em .9em}
    .opt{padding:.4em .7em}
    .top{flex-wrap:wrap;justify-content:center;gap:6px 12px;font-size:14px}
    .pill{padding:.15em .7em}
    .stage{gap:12px;padding:0 4px}
    .unit{font-size:13px}
    .q{font-size:clamp(22px,6.2vw,34px);line-height:1.45}
    .term{font-size:clamp(34px,10vw,56px)}
    .alias{font-size:15px}
    .stamp{font-size:22px}
    .big{font-size:56px}
    .timer{gap:10px}
    .sec{font-size:40px}
    .controls{gap:8px;padding-top:10px}
    .controls button{font-size:18px;min-width:0;flex:1;padding:.7em .4em}
    #pauseLayer h2{font-size:40px}
    #pauseLayer .row{gap:10px;flex-wrap:wrap;justify-content:center}
    #pauseLayer button{font-size:17px}
    #end{gap:10px;overflow-y:auto}
    #end > *{flex:none}
    #end h2{font-size:26px}
    .score{font-size:60px}
    .review{width:100%;grid-template-columns:1fr;font-size:15px;flex:none;overflow:visible}
    .endbtns{gap:8px;flex-wrap:wrap;justify-content:center}
    .endbtns button{font-size:16px}
    #list{padding:14px}
    #list .bar2{flex-wrap:wrap}
    .lgrid{grid-template-columns:1fr}
  }
  @media (max-width:700px) and (orientation:portrait){
    .sets{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-height:520px) and (orientation:landscape){
    .sets{grid-template-columns:repeat(4,minmax(0,1fr))}
    .q{font-size:clamp(20px,3.4vw,30px)}
    .stage{gap:6px}
    .top{flex-wrap:nowrap;justify-content:space-between}
    .controls button{flex:none;min-width:8em;padding:.45em 1em;font-size:16px}
    .sec{font-size:32px}
  }
</style>
</head>
<body>
<div class="board">

  <!-- 시작 -->
  <section class="screen" id="home">
    <h1>사회 개념 <span>스피드 퀴즈</span></h1>
    <div class="sub">단원 연습 · 설명을 읽고 개념을 말해요 · 제한 시간 2분 · 사회①·② 12개 단원 150개</div>
    <div class="sets" id="setBtns"></div>
    <div class="homebar">
      <label class="opt">제한 시간
        <select id="optTime"><option>5</option><option>7</option><option selected>10</option><option>15</option><option>20</option></select>초</label>
      <label class="opt">전체 시간
        <select id="optTotal"><option value="60">1분</option><option value="120" selected>2분</option><option value="180">3분</option><option value="300">5분</option><option value="0">제한 없음</option></select></label>
      <label class="opt"><input type="checkbox" id="optUnit" checked> 단원 표시</label>
      <label class="opt"><input type="checkbox" id="optShuffle"> 순서 섞기 <span class="muted">(정답 리스트와 순서 달라짐)</span></label>
      <label class="opt"><input type="checkbox" id="optSound" checked> 소리</label>
      <button id="fsBtn">전체 화면</button>
      <button id="listBtn">교사용 목록</button>
      <button id="dlBtn">정답 리스트 받기</button>
    </div>
  </section>

  <!-- 진행 -->
  <section class="screen" id="play" hidden>
    <div class="top">
      <span class="pill" id="setLabel">단원</span>
      <span>문제 <b id="qNo">1</b> / <span id="qTotal">25</span></span>
      <span class="pill" id="total">전체 2:00</span>
      <span id="who"><b>1</b>번째 학생</span>
      <span>맞힘 <b id="okCount">0</b></span>
    </div>

    <div class="stage" id="stage"></div>

    <div class="timer" id="timerBox">
      <div class="bar"><i id="barFill"></i></div>
      <div class="sec" id="sec">10</div>
    </div>
    <div class="controls">
      <button class="main" id="okBtn">○ 정답</button>
      <button class="pass" id="passBtn">패스</button>
      <button id="pauseBtn">일시정지</button>
    </div>
    <div class="keys">스페이스·Enter: 정답 &nbsp;·&nbsp; P 또는 →: 패스 &nbsp;·&nbsp; Esc: 일시정지</div>

    <div id="pauseLayer" hidden>
      <h2>잠깐 멈춤</h2>
      <div class="row">
        <button id="resumeBtn">계속하기</button>
        <button id="quitBtn">처음 화면으로</button>
      </div>
    </div>
  </section>

  <!-- 결과 -->
  <section class="screen" id="end" hidden>
    <h2 id="endTitle">끝!</h2>
    <div class="score" id="endScore">0 / 25</div>
    <div class="muted" id="endSub">다시 볼 개념</div>
    <div class="review" id="review"></div>
    <div class="endbtns">
      <button id="againBtn">같은 단원 다시</button>
      <button id="homeBtn">다른 단원 고르기</button>
    </div>
  </section>

  <!-- 교사용 목록 -->
  <section class="screen" id="list" hidden>
    <div class="bar2"><button id="listBack">← 돌아가기</button><button id="printBtn">인쇄</button><button id="dlBtn2">정답 리스트 받기(엑셀용)</button><h2>교사용 목록 · 12개 단원</h2></div>
    <div class="lgrid" id="lgrid"></div>
  </section>
</div>

<script>

/* ===== 설정 ===== */
const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const saved = store.get("speedquiz-opts") || {};
if(saved.time) $("optTime").value = saved.time;
if(saved.total !== undefined) $("optTotal").value = saved.total;
if(saved.unit !== undefined) $("optUnit").checked = saved.unit;
if(saved.shuffle !== undefined) $("optShuffle").checked = saved.shuffle;
if(saved.sound !== undefined) $("optSound").checked = saved.sound;
function saveOpts(){
  store.set("speedquiz-opts",{time:+$("optTime").value, total:+$("optTotal").value, unit:$("optUnit").checked, shuffle:$("optShuffle").checked, sound:$("optSound").checked});
}
["optTime","optTotal","optUnit","optShuffle","optSound"].forEach(id => $(id).addEventListener("change", saveOpts));

/* ===== 소리 (인터넷 없이 브라우저에서 생성) ===== */
let ac = null;
function beep(freq, dur, vol){
  if(!$("optSound").checked) return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if(ac.state === "suspended") ac.resume();
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = freq; o.type = "sine";
    g.gain.setValueAtTime(vol || .25, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
  }catch(e){}
}
const sndTick = () => beep(880, .12, .2);
const sndOk   = () => { beep(660, .12); setTimeout(() => beep(990, .22), 110); };
const sndEnd  = () => beep(220, .5, .3);

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("setBtns").innerHTML = SETS.map((s,i) => {
  const units = new Set(s.map(c => c.u)).size;
  return `<button data-set="${i}">${NAMES[i]}<small>${esc(SUBS[i])} · ${s.length}개</small></button>`;
}).join("");
$("setBtns").addEventListener("click", e => { const b = e.target.closest("button"); if(b) start(+b.dataset.set); });

/* ===== 진행 상태 ===== */
let G = null;   // {set, cards, i, ok, missed, phase, t0, left, paused}
let raf = 0, timeoutId = 0;

function start(setIdx){
  beep(1, .01, .001); // 첫 터치에서 소리 허용
  let cards = SETS[setIdx].slice();
  if($("optShuffle").checked){ for(let i=cards.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [cards[i],cards[j]]=[cards[j],cards[i]]; } }
  G = { set:setIdx, cards, i:0, ok:0, missed:[], turn:1, phase:"", left:0, limit:+$("optTime").value*1000, readyMs:0, paused:false };
  $("setLabel").textContent = NAMES[setIdx];
  $("qTotal").textContent = cards.length;
  G.totalMs = +$("optTotal").value * 1000; G.totalLeft = G.totalMs; G.timeUp = false;
  startTotal();
  $("pauseLayer").hidden = true;
  show("play");
  ready();
}

function clearTimers(){ cancelAnimationFrame(raf); clearTimeout(timeoutId); }

function header(){
  $("qNo").textContent = G.i + 1;
  $("who").innerHTML = `<b>${G.turn}</b>번째 학생`;
  $("okCount").textContent = G.ok;
}

/* 다음 학생 준비 카운트다운 */
function ready(){
  clearTimers(); header();
  setButtons(false);
  if(G.readyMs <= 0){ ask(); return; }
  G.phase = "ready"; G.left = G.readyMs; G.mark = performance.now();
  $("timerBox").style.visibility = "visible";
  $("timerBox").classList.remove("warn");
  setBar(1, Math.round(G.limit/1000));
  let lastShown = -1;
  const step = () => {
    if(G.paused) return;
    const left = G.left - (performance.now() - G.mark);
    const n = Math.ceil(left/1000);
    if(n !== lastShown){
      lastShown = n;
      $("stage").innerHTML = `<div class="stamp">다음 학생 준비</div><div class="big">${Math.max(n,1)}</div>`;
      if(n > 0) beep(520, .08, .15);
    }
    if(left <= 0){ ask(); return; }
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}

/* 문제 제시 + 제한 시간 */
function ask(){
  clearTimers();
  const c = G.cards[G.i];
  G.phase = "ask"; G.left = G.limit; G.mark = performance.now();
  $("timerBox").style.visibility = "visible";
  $("stage").innerHTML = ($("optUnit").checked ? `<div class="unit">${esc(c.u)} · ${esc(c.ut)}</div>` : "") + `<div class="q">${esc(c.d)}</div>`;
  setButtons(true);
  let lastSec = -1;
  const step = () => {
    if(G.paused) return;
    const left = G.left - (performance.now() - G.mark);
    const s = Math.ceil(Math.max(left,0)/1000);
    setBar(Math.max(left,0)/G.limit, s);
    $("timerBox").classList.toggle("warn", left <= 3000);
    if(s !== lastSec){ lastSec = s; if(s <= 3 && s > 0) sndTick(); }
    if(left <= 0){ reveal("time"); return; }
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}

function setBar(ratio, s){
  $("barFill").style.transform = `scaleX(${ratio})`;
  $("sec").textContent = s;
}
function setButtons(on){ $("okBtn").disabled = !on; $("passBtn").disabled = !on; $("okBtn").style.opacity = on?1:.4; $("passBtn").style.opacity = on?1:.4; }

/* 결과 보여 주고 자동으로 다음 학생 */
function reveal(kind){
  if(!G || G.phase !== "ask") return;
  clearTimers();
  G.turn++;
  if(kind === "time"){              // 시간 끝: 답은 보여 주지 않고, 같은 문제를 다음 학생이 10초 동안 도전
    sndEnd(); header();
    const w = $("who"); w.classList.remove("flash"); void w.offsetWidth; w.classList.add("flash");
    ask(); return;
  }
  setButtons(false);
  G.phase = "reveal";
  $("timerBox").style.visibility = "hidden";
  const c = G.cards[G.i];
  if(kind === "ok"){ G.ok++; sndOk(); } else { G.missed.push(c); sndEnd(); }
  $("okCount").textContent = G.ok;
  if(kind === "ok" || kind === "pass"){ next(); return; }   // 정답·패스 모두 답을 보여 주지 않고 바로 다음 문제
  const head = kind === "ok" ? `<div class="stamp ok">정답!</div>` : kind === "pass" ? `<div class="stamp bad">패스</div>` : `<div class="stamp bad">시간 끝!</div>`;
  const alias = c.a && c.a.length ? `<div class="alias">(${esc(c.a.join(", "))})</div>` : "";
  $("stage").innerHTML = head + `<div class="term">${esc(c.t)}</div>` + alias;
  G.left = kind === "ok" ? 1600 : 2400; G.mark = performance.now();
  waitThen(next);
}

/* 일시정지를 지키며 기다리기 */
function waitThen(fn){
  const step = () => {
    if(G.paused) return;
    if(G.left - (performance.now() - G.mark) <= 0){ fn(); return; }
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}

function next(){
  G.i++;
  if(G.i >= G.cards.length){ finish(); return; }
  ready();
}

function finish(){
  clearTimers(); stopTotal(); G.phase = "end";
  $("endTitle").textContent = G.timeUp ? `${NAMES[G.set]} · 시간 종료!` : `${NAMES[G.set]} 끝!`;
  $("endScore").textContent = `${G.ok} / ${G.cards.length}`;
  $("endSub").textContent = G.missed.length ? `다시 볼 개념 ${G.missed.length}개` : "모두 맞혔어요!";
  $("review").innerHTML = G.missed.map(c => `<div><b>${esc(c.t)}</b>${esc(c.od)}</div>`).join("");
  show("end");
}

/* ===== 전체 제한 시간 (기본 2분) ===== */
let totalTimer = 0;
const fmt = ms => { const t = Math.ceil(Math.max(ms,0)/1000); return `${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}`; };
function startTotal(){
  stopTotal();
  if(!G || !G.totalMs){ $("total").textContent = "전체 제한 없음"; $("total").classList.remove("warn"); return; }
  G.totalMark = performance.now();
  const tick = () => {
    const left = G.totalLeft - (performance.now() - G.totalMark);
    $("total").textContent = "전체 " + fmt(left);
    $("total").classList.toggle("warn", left <= 10000);
    if(left <= 0){ timeUp(); }
  };
  tick(); totalTimer = setInterval(tick, 200);
}
function stopTotal(){
  if(totalTimer){ clearInterval(totalTimer); totalTimer = 0; if(G && G.totalMs) G.totalLeft -= performance.now() - G.totalMark; }
}
function timeUp(){
  if(!G || G.phase === "end") return;
  stopTotal(); G.totalLeft = 0; G.timeUp = true;
  if(G.phase === "ask" && G.cards[G.i] && !G.missed.includes(G.cards[G.i])) G.missed.push(G.cards[G.i]);
  sndEnd(); finish();
}

/* 일시정지 */
function pause(){
  if(!G || G.paused || !["ready","ask","reveal"].includes(G.phase)) return;
  G.paused = true; clearTimers();
  G.left = G.left - (performance.now() - G.mark);
  stopTotal();
  $("pauseLayer").hidden = false;
}
function resume(){
  if(!G || !G.paused) return;
  G.paused = false; $("pauseLayer").hidden = true;
  G.mark = performance.now();
  startTotal();
  if(G.phase === "ask"){ resumeAsk(); }
  else if(G.phase === "ready"){ const l=G.left; ready(); G.left = l; G.mark = performance.now(); }
  else if(G.phase === "reveal"){ waitThen(next); }
}
function resumeAsk(){
  let lastSec = -1;
  const step = () => {
    if(G.paused) return;
    const left = G.left - (performance.now() - G.mark);
    const s = Math.ceil(Math.max(left,0)/1000);
    setBar(Math.max(left,0)/G.limit, s);
    $("timerBox").classList.toggle("warn", left <= 3000);
    if(s !== lastSec){ lastSec = s; if(s <= 3 && s > 0) sndTick(); }
    if(left <= 0){ reveal("time"); return; }
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}

/* ===== 버튼·키보드 ===== */
$("okBtn").onclick = () => reveal("ok");
$("passBtn").onclick = () => reveal("pass");
$("pauseBtn").onclick = pause;
$("resumeBtn").onclick = resume;
$("quitBtn").onclick = () => { clearTimers(); stopTotal(); G = null; show("home"); };
$("againBtn").onclick = () => start(G.set);
$("homeBtn").onclick = () => { G = null; show("home"); };
$("fsBtn").onclick = () => { const d=document.documentElement; (document.fullscreenElement ? document.exitFullscreen() : (d.requestFullscreen||d.webkitRequestFullscreen).call(d)).catch?.(()=>{}); };

document.addEventListener("keydown", e => {
  if(!G || $("play").hidden) return;
  if(e.key === "Escape"){ e.preventDefault(); G.paused ? resume() : pause(); return; }
  if(G.paused){ if(e.key === " " || e.key === "Enter"){ e.preventDefault(); resume(); } return; }
  if(e.key === " " || e.key === "Enter"){ e.preventDefault(); reveal("ok"); }
  else if(e.key === "p" || e.key === "P" || e.key === "ArrowRight"){ e.preventDefault(); reveal("pass"); }
});
/* 다른 창으로 가면 자동 일시정지 */
document.addEventListener("visibilitychange", () => { if(document.hidden) pause(); });

/* ===== 교사용 목록 ===== */
$("listBtn").onclick = () => {
  $("lgrid").innerHTML = SETS.map((s,i) => `<div class="lset"><h3>${NAMES[i]} · ${esc(SUBS[i])}</h3><ol>${s.map(c => `<li>${esc(c.t)}<span>${esc(c.p)}쪽</span></li>`).join("")}</ol></div>`).join("");
  show("list");
};
$("listBack").onclick = () => show("home");
$("printBtn").onclick = () => window.print();

/* ===== 정답 리스트 내려받기 (엑셀에서 열리는 CSV, 인터넷 없이 동작) ===== */
function downloadAnswers(){
  const q = v => '"' + String(v ?? "").replace(/"/g,'""') + '"';
  const rows = [["단원","번호","정답","다른 이름","쪽","설명"]];
  SETS.forEach((s,i) => s.forEach((c,j) => rows.push([NAMES[i] + " " + SUBS[i], j+1, c.t, (c.a||[]).join(", "), c.p, c.od])));
  const csv = "\ufeff" + rows.map(r => r.map(q).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
  a.download = "사회개념_스피드퀴즈_단원연습_정답리스트.csv";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
$("dlBtn").onclick = downloadAnswers;
$("dlBtn2").onclick = downloadAnswers;

show("home");
</script>
</body>
