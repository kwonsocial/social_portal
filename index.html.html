<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1524">
<title>영파 서고 · 사회과 포털</title>
<style>
  :root{
    --navy:#0c1524; --navy2:#12233a; --panel:rgba(14,26,44,.78); --panel2:rgba(20,36,58,.9);
    --ink:#f3f5f8; --ink2:#c9d3e0; --muted:#8fa0b6; --line:rgba(234,208,156,.28);
    --gold:#ead09c; --gold2:#c9a868;
    --serif:Georgia,"Nanum Myeongjo","Noto Serif KR","AppleMyungjo","Batang",serif;
    --sans:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    word-break:keep-all;
    font-family:var(--sans); color:var(--ink); background:var(--navy);
    min-height:100dvh; display:flex; flex-direction:column; position:relative;
  }
  /* 배경: 사회 개념 복원실 표지 그림 */
  .bg{position:fixed;inset:0;z-index:0;
      background:
        linear-gradient(90deg,#0a1323f2 0%,#0c1830c4 38%,#0e1c3070 70%,#0e1c3040 100%),
        linear-gradient(0deg,#0a1323e6 0%,transparent 45%),
        url("bg.jpg") center right / cover no-repeat;
      transition:filter 1.8s ease}
  body.mono .bg{filter:grayscale(1) brightness(.85)}
  body.mono .room .mark, body.mono .pl{filter:grayscale(1)}

  .wrap{position:relative;z-index:1;width:100%;max-width:1200px;margin:0 auto;
        padding:max(22px,env(safe-area-inset-top)) 28px 10px;flex:1;display:flex;flex-direction:column;gap:24px}

  /* ===== 머리 ===== */
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .eyebrow{font-size:12px;letter-spacing:.32em;color:var(--gold)}
  .brand h1{font-family:var(--serif);font-size:36px;font-weight:700;letter-spacing:-.01em;margin-top:6px;text-shadow:0 2px 14px #061121}
  .brand h1 em{font-style:normal;color:var(--gold)}
  .brand p{font-family:var(--serif);font-size:16px;color:var(--ink2);margin-top:8px;text-shadow:0 2px 12px #061121}

  .idbox{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
         border-radius:14px;padding:10px 10px 10px 16px;backdrop-filter:blur(6px);cursor:pointer}
  .idbox .label{font-size:11px;letter-spacing:.2em;color:var(--muted)}
  .idbox .code{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:.1em;color:var(--gold)}

  button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:11px 18px;font-weight:700}
  .btn{background:var(--gold);color:#1a1408}
  .btn.light{background:#22344d;color:var(--ink)}
  .btn.ghost{background:transparent;color:var(--muted);font-weight:500;font-size:13px;padding:8px 10px}
  .btn.ghost:hover{color:var(--gold)}

  /* ===== 열람실 ===== */
  .rooms{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;width:100%;max-width:900px;margin:0 auto;flex:1;align-items:stretch}
  .room{position:relative;display:flex;flex-direction:column;justify-content:center;gap:10px;text-decoration:none;color:inherit;
        background:linear-gradient(180deg,rgba(18,33,54,.38) 0%,rgba(12,22,38,.78) 45%,rgba(10,20,35,.9) 100%);
        border:1px solid var(--line);border-radius:140px 140px 18px 18px;
        padding:46px 24px 30px;min-height:300px;overflow:hidden;backdrop-filter:blur(5px);
        box-shadow:0 18px 40px rgba(0,0,0,.35);transition:transform .2s, border-color .2s, box-shadow .2s}
  .room::before{content:"";position:absolute;inset:10px;border:1px solid rgba(234,208,156,.16);
        border-radius:130px 130px 12px 12px;pointer-events:none}
  .room:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 22px 46px rgba(0,0,0,.45)}
  .room:active{transform:scale(.985)}
  .room .no{align-self:center;font-family:var(--serif);font-size:12px;letter-spacing:.3em;color:var(--gold2)}
  .room .mark{align-self:center;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;
        background:rgba(234,208,156,.1);border:1px solid var(--line);color:var(--gold);margin:2px 0 4px}
  .room .mark svg{width:34px;height:34px}
  .room h2{text-align:center;font-family:var(--serif);font-size:26px;font-weight:700}
  .room .tag{align-self:center;font-size:12px;font-weight:700;color:var(--gold);
        border:1px solid var(--line);padding:3px 10px;border-radius:999px}
  .room p{text-align:center;font-size:15px;line-height:1.6;color:var(--ink2)}
  .room .go{align-self:center;margin-top:12px;font-weight:800;font-size:15px;color:var(--gold);letter-spacing:.04em}

  /* 기록이 사라진 날: 여섯 기둥 */
  .pls{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;margin:6px 0 0;padding:12px 4px 8px;
       border-top:1px solid rgba(234,208,156,.16);border-bottom:1px solid rgba(234,208,156,.16)}
  .pl{position:relative;text-align:center}
  .pl .glow{position:absolute;left:50%;top:34%;width:64px;height:64px;transform:translate(-50%,-50%) scale(.3);border-radius:50%;
            background:radial-gradient(var(--c),transparent 65%);opacity:0;transition:opacity 1.2s, transform 1.4s}
  .pl svg{position:relative;width:22px;height:46px;display:block;margin:0 auto 4px}
  .pl svg .stone{fill:#465468;transition:fill 1s}
  .pl svg .flame{fill:#ffe6a8;opacity:0;transition:opacity 1s}
  .pl b{position:relative;display:block;font-family:var(--serif);font-size:13px;font-weight:700;color:var(--muted)}
  .pl.lit .glow{opacity:.6;transform:translate(-50%,-50%) scale(1)}
  .pl.lit svg .stone{fill:var(--c)}
  .pl.lit svg .flame{opacity:1}
  .pl.lit b{color:var(--ink)}
  .plcount{text-align:center;font-size:12px;color:var(--muted);margin-top:2px}

  /* ===== 입장 화면 ===== */
  .gate{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;
        background:rgba(6,12,22,.6);backdrop-filter:blur(4px)}
  .gate[hidden],.sheet[hidden]{display:none}
  .sheet{position:relative;width:100%;max-width:500px;background:linear-gradient(180deg,#14263d,#0d1a2c);
        border:1px solid var(--line);border-radius:20px;padding:34px 30px 28px;
        display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 60px rgba(0,0,0,.5)}
  .sheet::before{content:"";position:absolute;inset:8px;border:1px solid rgba(234,208,156,.14);border-radius:14px;pointer-events:none}
  .sheet .eyebrow{text-align:center;font-size:11px}
  .sheet h2{font-family:var(--serif);font-size:26px;text-align:center}
  .sheet p{font-size:15px;line-height:1.7;color:var(--ink2);text-align:center}
  .sheet p b{color:var(--gold)}
  .sheet .big{font-family:var(--serif);font-size:42px;font-weight:700;letter-spacing:.12em;text-align:center;color:var(--gold);
        background:rgba(0,0,0,.25);border:1px dashed var(--line);border-radius:12px;padding:14px}
  .sheet input{font:inherit;font-family:var(--serif);font-size:24px;letter-spacing:.1em;text-align:center;text-transform:uppercase;
        padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink);width:100%}
  .sheet input::placeholder{color:#5d6d82}
  .sheet input:focus{outline:2px solid var(--gold);outline-offset:1px}
  .row{position:relative;display:flex;gap:10px}
  .row > *{flex:1}
  .note{font-size:12px !important;color:var(--muted) !important}
  .err{color:#ff9d8f;font-size:14px;min-height:1.2em;text-align:center}

  footer{position:relative;z-index:1;text-align:center;font-size:12px;color:var(--muted);padding:6px 0 max(14px,env(safe-area-inset-bottom))}
  footer a{color:var(--muted)}

  @media (max-width:700px){
    .rooms{grid-template-columns:1fr}
    .room{border-radius:24px;min-height:auto;padding:26px 22px}
    .room::before{border-radius:18px}
    .brand h1{font-size:27px}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>
</head>
<body class="mono">
<div class="bg" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="eyebrow">영파 서고</div>
      <h1>사회과 <em>포털</em></h1>
      <p>사실은 남았지만, 그것을 설명하던 기록이 사라졌다.</p>
    </div>
    <div class="idbox" id="idbox" title="복원자 코드">
      <div>
        <div class="label">복원자 코드</div>
        <div class="code" id="codeView">—</div>
      </div>
      <button class="btn ghost" id="exitBtn">나가기</button>
    </div>
  </header>

  <section class="rooms" id="rooms" aria-label="열람실 바로가기"></section>
</div>

<footer>
  © 영파여자중학교 교육용 웹앱 ·
  <a href="https://sites.google.com/youngpa.sen.ms.kr/webapp-privacy" target="_blank" rel="noopener">개인정보처리방침</a>
</footer>

<!-- 입장 화면 -->
<div class="gate" id="gate" hidden>
  <div class="sheet" id="sheetStart">
    <div class="eyebrow">영파 서고 입구</div>
    <h2>복원자 등록</h2>
    <p>서고에 들어가려면 <b>복원자 코드</b>가 필요해요.<br>이름이나 학번은 쓰지 않아요.</p>
    <div class="row">
      <button class="btn" id="newBtn">새 코드 받기</button>
      <button class="btn light" id="haveBtn">코드가 있어요</button>
    </div>
  </div>

  <div class="sheet" id="sheetNew" hidden>
    <div class="eyebrow">새 복원자</div>
    <h2>나의 복원자 코드</h2>
    <div class="big" id="newCode"></div>
    <p>이 코드를 <b>활동지 오른쪽 위</b>에 적어 두세요.<br>다른 기기에서 이어 할 때 필요해요.</p>
    <div class="row"><button class="btn" id="okBtn">적었어요, 들어가기</button></div>
  </div>

  <div class="sheet" id="sheetHave" hidden>
    <div class="eyebrow">돌아온 복원자</div>
    <h2>코드로 이어하기</h2>
    <input id="codeInput" placeholder="2026-1234" maxlength="9" autocomplete="off" inputmode="numeric" spellcheck="false">
    <div class="err" id="err"></div>
    <div class="row">
      <button class="btn light" id="backBtn">뒤로</button>
      <button class="btn" id="enterBtn">들어가기</button>
    </div>
    <p class="note">사회 개념 복원실에서 받은 코드도 그대로 쓸 수 있어요. 진행 기록은 기기마다 따로 저장돼요.</p>
  </div>
</div>

<script>
/* ===== 설정: 주소·순서는 여기서만 바꾸면 됩니다 ===== */
const ICONS = {
  scroll:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h11a2 2 0 0 1 2 2v1h-4M7 4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7M7 4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2M12 10h4M12 13h4M12 16h3"/></svg>',
  pillar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 21h18M5 18h14M6 18V8M10 18V8M14 18V8M18 18V8M4 8h16L12 3z"/></svg>'
};

const LINKS = [
  { no:"제1 열람실", icon:"scroll", tag:"개념 학습",
    title:"사회 개념 복원실", desc:"사라진 개념 기록을 살펴보고 연결해요.",
    url:"https://kwonsocial.github.io/social-archive-review/" },
  { no:"제2 열람실", icon:"pillar", tag:"전환기 활동 · 점수 없음",
    title:"기록이 사라진 날", desc:"영파 서고를 움직이며 여섯 기둥에 다시 불을 밝혀요.",
    url:"https://kwonsocial.github.io/record-lost-day/", pillars:true }
];

/* 「기록이 사라진 날」 게임의 기둥 (게임 코드의 id·색과 같음) */
const PILLARS = [
  { id:"jon",   name:"존엄", c:"#8a4f9e" },
  { id:"jeong", name:"정의", c:"#3b6ea5" },
  { id:"seon",  name:"선택", c:"#c0583a" },
  { id:"teo",   name:"터전", c:"#3f7d4e" },
  { id:"gong",  name:"공존", c:"#d47fa6" },
  { id:"yeon",  name:"연결", c:"#e2a93b" }
];
const GAME_SAVE_KEY = "record-lost-day-v1";  // 게임이 저장하는 진행 기록(읽기만 함)

/* 복원자 코드 = 사회 개념 복원실의 학습 코드(2026-0000 형태)
   복원실이 쓰는 저장 칸을 그대로 함께 써서, 한쪽에서 들어가면 다른 쪽도 같은 코드로 열립니다. */
const ACC_KEY = "youngpa-social-accounts-v1";
const CODE_RE = /^\d{8}$/;
const YEAR = "2026";

/* ===== 저장소 (실패해도 화면은 동작) ===== */
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
};
let memId = null;
function readBook(){
  try{
    const b = JSON.parse(store.get(ACC_KEY) || "null");
    if(b && b.version === 1 && Array.isArray(b.list)) return b;
  }catch(e){}
  return { version:1, list:[], active:null, guest:false };
}
function getId(){
  const b = readBook();
  if(b.active && b.list.some(a => a && a.id === b.active)) return b.active;
  return memId;
}
function setId(id){
  memId = id;
  const b = readBook();
  if(!b.list.some(a => a && a.id === id)) b.list.push({ id, nick:"", createdAt:new Date().toISOString() });
  b.active = id; b.guest = false;
  store.set(ACC_KEY, JSON.stringify(b));
}
function signOut(){
  memId = null;
  const b = readBook();
  b.active = null; b.guest = false;
  store.set(ACC_KEY, JSON.stringify(b));
}
const pretty = id => id ? id.slice(0,4) + "-" + id.slice(4) : "—";
const cleanCode = v => String(v || "").replace(/[^0-9]/g, "");

function makeCode(){
  const taken = new Set(readBook().list.map(a => a && a.id));
  const r = new Uint32Array(1);
  for(let i = 0; i < 400; i++){
    crypto.getRandomValues(r);
    const id = YEAR + String(1000 + r[0] % 9000);
    if(!taken.has(id)) return id;
  }
  return YEAR + String(Date.now()).slice(-4);
}

function solvedPillars(){
  try{ const g = JSON.parse(store.get(GAME_SAVE_KEY) || "{}"); return Array.isArray(g.solved) ? g.solved : []; }
  catch(e){ return []; }
}

/* ===== 화면 ===== */
const $ = id => document.getElementById(id);

const PILLAR_SVG = '<svg viewBox="0 0 22 46"><path class="flame" d="M11 0c2.4 3 3.4 4.6 3.4 6.4a3.4 3.4 0 0 1-6.8 0C7.6 4.6 8.6 3 11 0z"/><rect class="stone" x="3" y="11" width="16" height="3" rx=".6"/><rect class="stone" x="5.5" y="15" width="11" height="25" rx=".6"/><rect class="stone" x="2" y="41" width="18" height="4.5" rx=".6"/></svg>';

function pillarsHTML(){
  const done = solvedPillars();
  const n = PILLARS.filter(p => done.includes(p.id)).length;
  return `<div class="pls">${PILLARS.map(p => `
      <div class="pl ${done.includes(p.id) ? "lit" : ""}" style="--c:${p.c}">
        <span class="glow"></span>${PILLAR_SVG}<b>${p.name}</b>
      </div>`).join("")}</div>
    <div class="plcount">밝힌 기둥 ${n} / 6</div>`;
}

function renderRooms(){
  $("rooms").innerHTML = LINKS.map(l => `
    <a class="room" href="${l.url}">
      <span class="no">${l.no}</span>
      <span class="mark">${ICONS[l.icon]}</span>
      <h2>${l.title}</h2>
      <span class="tag">${l.tag}</span>
      <p>${l.desc}</p>
      ${l.pillars ? pillarsHTML() : ""}
      <span class="go">들어가기 →</span>
    </a>`).join("");
}

function renderId(){
  const id = getId();
  $("codeView").textContent = pretty(id);
  $("exitBtn").textContent = id ? "나가기" : "들어가기";
  document.body.classList.toggle("mono", !id);
  renderRooms();
}

function show(sheet){
  $("gate").hidden = !sheet;
  ["sheetStart","sheetNew","sheetHave"].forEach(s => $(s).hidden = s !== sheet);
}

/* ===== 동작 ===== */
let pending = null;
$("newBtn").onclick  = () => { pending = makeCode(); $("newCode").textContent = pretty(pending); show("sheetNew"); };
$("okBtn").onclick   = () => { setId(pending); show(null); renderId(); };
$("haveBtn").onclick = () => { $("err").textContent=""; $("codeInput").value=""; show("sheetHave"); $("codeInput").focus(); };
$("backBtn").onclick = () => show("sheetStart");
$("enterBtn").onclick = () => {
  let v = cleanCode($("codeInput").value);
  if(v.length === 4) v = YEAR + v;
  if(!CODE_RE.test(v)){ $("err").textContent = "코드 숫자를 확인해 주세요. 예: 2026-1234"; return; }
  setId(v); show(null); renderId();
};
$("codeInput").addEventListener("keydown", e => { if(e.key==="Enter") $("enterBtn").click(); });
$("exitBtn").onclick = e => {
  e.stopPropagation();
  if(getId()){ signOut(); renderId(); }
  show("sheetStart");
};
$("idbox").addEventListener("click", () => { if(!getId()) show("sheetStart"); });
/* 코드 없이 열람실을 누르면 입장 화면으로 */
$("rooms").addEventListener("click", e => {
  if(!getId() && e.target.closest(".room")){ e.preventDefault(); show("sheetStart"); }
});

/* 게임에서 기둥을 밝히거나 복원실에서 코드가 바뀌면 바로 반영 */
window.addEventListener("storage", e => { if(e.key===GAME_SAVE_KEY || e.key===ACC_KEY) renderId(); });
/* 게임에서 뒤로 돌아왔을 때 다시 읽기 */
window.addEventListener("pageshow", renderId);

/* ===== 화면 꺼짐 방지 (Screen Wake Lock) ===== */
let wakeLock = null;
async function keepAwake(){
  if(!("wakeLock" in navigator) || document.visibilityState !== "visible" || wakeLock) return;
  try{
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  }catch(e){ wakeLock = null; }  // 배터리 절약 모드 등으로 거절되면 다음 터치 때 다시 시도
}
/* 다른 앱에 갔다가 돌아오면 다시 켜기 */
document.addEventListener("visibilitychange", keepAwake);
/* 일부 브라우저는 화면을 한 번 눌러야 허용 */
["pointerdown","keydown"].forEach(t => document.addEventListener(t, keepAwake, { passive:true }));
keepAwake();

renderId();
if(!getId()) show("sheetStart");
</script>
</body>
</html>
